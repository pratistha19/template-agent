global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Agent metrics export via OTLP (Jaeger/otel-gateway), not Prometheus scrape.
  # Prometheus is included in the observability profile for self-monitoring only.

  # Scrape Prometheus self-monitoring metrics
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
